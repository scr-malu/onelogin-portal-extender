# 拡張機能の zip を自動生成するワークフロー
#  - push / PR: ビルドして Actions の成果物としてアップロード
#  - v* タグの push: GitHub Release を作成して zip を添付
name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onelogin-portal-extender
          path: dist/onelogin-portal-extender-v*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/onelogin-portal-extender-v*.zip
          generate_release_notes: true
